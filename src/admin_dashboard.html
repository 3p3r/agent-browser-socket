<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agent-browser-server launcher</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 24px;
        max-width: 640px;
      }
      h1 {
        margin-bottom: 8px;
      }
      p {
        color: #444;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 10px 0;
        flex-wrap: wrap;
      }
      label {
        min-width: 48px;
      }
      input {
        padding: 6px 8px;
        min-width: 220px;
      }
      button {
        padding: 8px 12px;
        cursor: pointer;
      }
      code {
        background: #f5f5f5;
        padding: 2px 6px;
        border-radius: 4px;
      }
      #uri {
        margin-top: 8px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>agent-browser-server launcher</h1>
    <p>Launch via <code>abs://</code> from a webpage.</p>

    <div class="row">
      <label for="host">Host</label>
      <input id="host" value="127.0.0.1" />
    </div>

    <div class="row">
      <label for="port">Port</label>
      <input id="port" value="9607" />
    </div>

    <div class="row">
      <button id="launch">Launch abs://open</button>
    </div>

    <div class="row">
      <a href="/skills/">Open skills reference</a>
    </div>

    <div id="uri"></div>

    <script>
      const hostInput = document.getElementById("host");
      const portInput = document.getElementById("port");
      const uriOutput = document.getElementById("uri");

      if (window.location.hostname && window.location.hostname !== "0.0.0.0") {
        hostInput.value = window.location.hostname;
      }
      if (window.location.port) {
        portInput.value = window.location.port;
      }

      function buildUri() {
        const host = hostInput.value.trim() || "127.0.0.1";
        const port = portInput.value.trim() || "9607";
        return `abs://open?host=${encodeURIComponent(host)}&port=${encodeURIComponent(port)}`;
      }

      document.getElementById("launch").addEventListener("click", () => {
        const uri = buildUri();
        uriOutput.textContent = uri;

        const link = document.createElement("a");
        link.href = uri;
        link.style.display = "none";
        document.body.appendChild(link);
        link.click();
        link.remove();
      });
    </script>
  </body>
</html>
