<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agent-browser-socket admin dashboard</title>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    input, textarea, button, select { font: inherit; }
    input, select { padding: 6px 8px; min-width: 220px; }
    textarea { width: 100%; height: 140px; padding: 8px; }
    button { padding: 6px 10px; cursor: pointer; }
    #status { font-weight: 600; }
    #events { white-space: pre-wrap; border: 1px solid #ccc; padding: 8px; min-height: 280px; overflow: auto; }
    small { color: #444; }
  </style>
</head>
<body>
  <h1>agent-browser-socket admin dashboard</h1>

  <h3>Connection</h3>
  <div class="row">
    <label for="url">Server URL:</label>
    <input id="url" />
    <button id="connect">Connect</button>
    <button id="disconnect">Disconnect</button>
  </div>
  <div class="row">
    <span>Status: <span id="status">disconnected</span></span>
  </div>

  <h3>Quick actions</h3>
  <div class="row">
    <button id="sendHealth">Emit health</button>
    <button id="sendVersion">Emit version</button>
    <button id="sendScreenshot">Emit screenshot</button>
    <button id="sendCommandVersion">Emit command (--version)</button>
    <button id="sendCommandInstall">Emit command (install)</button>
    <button id="sendShutdown">Emit shutdown</button>
  </div>
  <div class="row">
    <small>shutdown is only available in URI launch mode.</small>
  </div>

  <h3>abs:// helpers</h3>
  <div class="row">
    <label for="absPort">Port:</label>
    <input id="absPort" value="9911" />
    <label for="absHost">Host:</label>
    <input id="absHost" value="127.0.0.1" />
  </div>
  <div class="row">
    <button id="launchAbsUri">Launch abs://</button>
    <button id="registerUri">POST /register-uri</button>
    <button id="unregisterUri">POST /unregister-uri</button>
  </div>

  <h3>Custom emit</h3>
  <div class="row">
    <label for="eventName">Event:</label>
    <input id="eventName" value="command" />
  </div>
  <div class="row">
    <label for="payload">Payload JSON:</label>
  </div>
  <textarea id="payload">{"args":["--version"]}</textarea>
  <div class="row">
    <button id="emitCustom">Emit custom event</button>
    <button id="clearLog">Clear log</button>
  </div>

  <h3>Event log</h3>
  <div id="events"></div>

  <script src="/assets/socket.io.min.js"></script>
  <script src="/assets/page-agent.demo.js"></script>
  <script>
    let socket = null;

    const statusEl = document.getElementById('status');
    const eventsEl = document.getElementById('events');
    const urlEl = document.getElementById('url');
    const eventNameEl = document.getElementById('eventName');
    const payloadEl = document.getElementById('payload');
    const absPortEl = document.getElementById('absPort');
    const absHostEl = document.getElementById('absHost');

    urlEl.value = window.location.origin;

    function now() {
      return new Date().toISOString();
    }

    function log(message, data) {
      const suffix = typeof data === 'undefined' ? '' : ` ${JSON.stringify(data)}`;
      eventsEl.textContent += `[${now()}] ${message}${suffix}\n`;
      eventsEl.scrollTop = eventsEl.scrollHeight;
    }

    function setStatus(value) {
      statusEl.textContent = value;
    }

    function attachCoreListeners(activeSocket) {
      activeSocket.on('connect', () => {
        setStatus(`connected (${activeSocket.id})`);
        log('connected', { id: activeSocket.id });
      });

      activeSocket.on('disconnect', (reason) => {
        setStatus(`disconnected (${reason})`);
        log('disconnect', { reason });
      });

      activeSocket.on('connect_error', (error) => {
        setStatus('connect_error');
        log('connect_error', { message: error.message });
      });

      ['health', 'version', 'shutdown', 'stdout', 'stderr', 'exit', 'error', 'screenshot'].forEach((name) => {
        activeSocket.on(name, (payload) => {
          log(`event:${name}`, payload);
        });
      });
    }

    function ensureConnected() {
      if (!socket || !socket.connected) {
        throw new Error('socket is not connected');
      }
    }

    function parsePayload() {
      const text = payloadEl.value.trim();
      if (!text) {
        return {};
      }
      return JSON.parse(text);
    }

    function buildAbsUri() {
      const port = absPortEl.value.trim();
      const host = absHostEl.value.trim();
      const uri = `abs://open?port=${encodeURIComponent(port)}&host=${encodeURIComponent(host)}`;
      const socketUrl = `http://${host}:${port}`;
      return { uri, socketUrl };
    }

    function currentServerOrigin() {
      const parsed = new URL(urlEl.value.trim());
      return parsed.origin;
    }

    async function callUriEndpoint(path) {
      const endpoint = `${currentServerOrigin()}${path}`;
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        }
      });
      let payload = {};
      try {
        payload = await response.json();
      } catch (_error) {
        payload = {};
      }
      if (!response.ok) {
        throw new Error(payload.message || `request failed (${response.status})`);
      }
      return payload;
    }

    function triggerAbsUri(uri) {
      const launchLink = document.createElement('a');
      launchLink.href = uri;
      launchLink.style.display = 'none';
      document.body.appendChild(launchLink);
      launchLink.click();
      launchLink.remove();
    }

    document.getElementById('connect').addEventListener('click', () => {
      if (socket) {
        socket.disconnect();
      }

      const url = urlEl.value.trim();
      socket = io(url, {
        transports: ['websocket', 'polling'],
        timeout: 5000
      });

      attachCoreListeners(socket);
      setStatus('connecting');
      log('connecting', { url });
    });

    document.getElementById('disconnect').addEventListener('click', () => {
      if (socket) {
        socket.disconnect();
        log('manual disconnect');
      }
    });

    document.getElementById('sendHealth').addEventListener('click', () => {
      try {
        ensureConnected();
        socket.emit('health', {});
        log('emit health', {});
      } catch (error) {
        log('emit health failed', { message: error.message });
      }
    });

    document.getElementById('sendVersion').addEventListener('click', () => {
      try {
        ensureConnected();
        socket.emit('version', {});
        log('emit version', {});
      } catch (error) {
        log('emit version failed', { message: error.message });
      }
    });

    document.getElementById('sendScreenshot').addEventListener('click', () => {
      try {
        ensureConnected();
        socket.emit('screenshot', {});
        log('emit screenshot', {});
      } catch (error) {
        log('emit screenshot failed', { message: error.message });
      }
    });

    document.getElementById('sendCommandVersion').addEventListener('click', () => {
      try {
        ensureConnected();
        const payload = { args: ['--version'] };
        socket.emit('command', payload);
        log('emit command', payload);
      } catch (error) {
        log('emit command failed', { message: error.message });
      }
    });

    document.getElementById('sendCommandInstall').addEventListener('click', () => {
      try {
        ensureConnected();
        const payload = { args: ['install'] };
        socket.emit('command', payload);
        log('emit command install', payload);
      } catch (error) {
        log('emit command install failed', { message: error.message });
      }
    });

    document.getElementById('sendShutdown').addEventListener('click', () => {
      try {
        ensureConnected();
        socket.emit('shutdown', {});
        log('emit shutdown', {});
      } catch (error) {
        log('emit shutdown failed', { message: error.message });
      }
    });

    document.getElementById('emitCustom').addEventListener('click', () => {
      try {
        ensureConnected();
        const eventName = eventNameEl.value.trim();
        const payload = parsePayload();
        socket.emit(eventName, payload);
        log(`emit ${eventName}`, payload);
      } catch (error) {
        log('emit custom failed', { message: error.message });
      }
    });

    document.getElementById('clearLog').addEventListener('click', () => {
      eventsEl.textContent = '';
    });

    document.getElementById('launchAbsUri').addEventListener('click', () => {
      try {
        const { uri, socketUrl } = buildAbsUri();
        triggerAbsUri(uri);
        urlEl.value = socketUrl;
        log('launched abs uri', { uri, socketUrl });
      } catch (error) {
        log('launch abs uri failed', { message: error.message });
      }
    });

    document.getElementById('registerUri').addEventListener('click', async () => {
      try {
        const payload = await callUriEndpoint('/register-uri');
        log('register uri scheme', payload);
      } catch (error) {
        log('register uri scheme failed', { message: error.message });
      }
    });

    document.getElementById('unregisterUri').addEventListener('click', async () => {
      try {
        const payload = await callUriEndpoint('/unregister-uri');
        log('unregister uri scheme', payload);
      } catch (error) {
        log('unregister uri scheme failed', { message: error.message });
      }
    });
  </script>
</body>
</html>
