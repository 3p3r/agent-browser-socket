[package]
name = "oatmeal"
version = "1.0.0"
edition = "2021"
build = "build.rs"
description = "System tray MCP server with embedded browser automation and sandboxed shell execution"
license = "MIT"
repository = "https://github.com/3p3r/oatmeal"
readme = "README.md"
keywords = ["mcp", "tray", "browser", "automation", "desktop"]
categories = ["development-tools", "network-programming"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.8"
config = { version = "0.15", default-features = false, features = ["toml"] }
dirs = "6"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "1", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.145"
secure-string = "0.3"
shlex = "1"
once_cell = "1"
sysuri = "0.4"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1", features = ["log"] }
log = "0.4"
log4rs = { version = "1.4", default-features = false, features = ["all_components", "gzip"] }
url = "2"
xcap = "0.4.1"
base64 = "0.22"
bashkit = { git = "https://github.com/everruns/bashkit", rev = "3c4c6ae8621ef3c3c9c4aba413f2db87d4955987", features = ["python"] }
ftmi = "0.2"
ignore = "0.4"
png = "0.17"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
tray-icon = "0.21"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4"
open = "5"

[build-dependencies]
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winres = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
once_cell = "1"

[target.'cfg(target_os = "windows")'.dependencies]
mslnk = "0.1"
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
is-wsl = "0.4"
